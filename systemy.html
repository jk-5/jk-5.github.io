<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systemy Operacyjne | J.K Serwis PC</title>
    <link rel="icon" type="image/x-icon" href="https://github.com/jk-5/jk-5.github.io/raw/refs/heads/main/favicon.ico">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            /* Zmiana: Idealna czerń pod ekrany OLED */
            background: #000000;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            overflow: hidden;
        }

        /* Kontener dla animacji fluid.js */
        #fluid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            /* Zmiana: Efekt szklanego kontenera */
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            
            position: relative;
            z-index: 1;
            pointer-events: none; /* Pozwala "malować" pod spodem */
        }

        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin: 0 auto 25px auto;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.7));
        }

        h1 { 
            color: #ffffff; 
            font-size: 1.6rem; 
            margin-bottom: 25px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .system-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto; /* Przywrócenie interakcji dla przycisków */
        }

        .system-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .system-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 120, 212, 0.5);
        }

        .system-info {
            text-align: left;
        }

        .system-name {
            display: block;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .system-desc {
            font-size: 0.85rem;
            color: #b0b0b0;
        }

        .btn-download {
            background: #0078d4;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-download:hover { 
            background: #0086f0;
            box-shadow: 0 0 15px rgba(0, 120, 212, 0.4);
        }

        /* Specjalny kolor dla starszych systemów */
        .legacy { border-left: 4px solid #fca311; }

        .btn-back {
            display: inline-block;
            margin-top: 35px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            pointer-events: auto;
        }

        .btn-back:hover { color: #0078d4; }
    </style>
</head>
<body>

    <!-- Element płótna dla animacji fluid -->
    <canvas id="fluid-canvas"></canvas>

    <div class="container">
        <img src="logo.png" alt="J.K Serwis PC Logo" class="logo">
        
        <h1>Systemy Operacyjne</h1>
        
        <div class="system-grid">
            <!-- Windows 11 -->
            <div class="system-item">
                <div class="system-info">
                    <span class="system-name">Windows 11</span>
                    <span class="system-desc">Najnowszy system operacyjny od Microsoft.</span>
                </div>
                <a href="https://www.microsoft.com/pl-pl/software-download/windows11" target="_blank" class="btn-download">Pobierz ISO</a>
            </div>

            <!-- Windows 10 -->
            <div class="system-item">
                <div class="system-info">
                    <span class="system-name">Windows 10</span>
                    <span class="system-desc">Stabilny i sprawdzony system do pracy i gier.</span>
                </div>
                <a href="https://www.microsoft.com/pl-pl/software-download/windows10" target="_blank" class="btn-download">Pobierz ISO</a>
            </div>

            <!-- Starsze systemy -->
            <div class="system-item legacy">
                <div class="system-info">
                    <span class="system-name">Starsze systemy</span>
                    <span class="system-desc">Win 7, 8.1, XP oraz wersje modyfikowane.</span>
                </div>
                <a href="https://basewin.pl/" target="_blank" class="btn-download" style="background: #fca311;">Otwórz bazę</a>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Powrót do menu głównego</a>
    </div>

    <!-- Podpięcie skryptu animacji -->
    <script src="fluid.js"></script>

</body>
</html>
