<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        :root {
            --bg-color: #050510;
            --panel-color: #1a1a2e;
            --accent-color: #00f2ff;
            --snake-color: #3A86FF;
            --food-color: #FF006E;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: rgba(26, 26, 46, 0.8);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-color);
            border: 1px solid rgba(0, 242, 255, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 10px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--accent-color);
        }

        canvas {
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid var(--food-color);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            box-shadow: 0 0 100px var(--food-color);
            text-align: center;
        }

        #start-prompt {
            position: absolute;
            bottom: 40px;
            color: var(--accent-color);
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0.2; } }

        button {
            background: var(--accent-color);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            margin-top: 20px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .controls-hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-over">
        <h1 style="color: var(--food-color); margin: 0;">KOLIZJA SYSTEMU</h1>
        <p id="final-score" class="stat-value" style="color: #fff; text-shadow: none; margin: 15px 0;">Wynik: 0</p>
        <button onclick="resetGame()">Zrestartuj System</button>
    </div>

    <div class="game-container">
        <div class="header">
            <div class="stat-box">
                <div class="stat-value" style="font-size: 1rem;">SNAKE</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Punkty</div>
                <div id="score" class="stat-value">0</div>
            </div>
        </div>

        <canvas id="snakeGame" width="600" height="600"></canvas>
        
        <div id="start-prompt">OCZEKIWANIE NA DANE... [UŻYJ STRZAŁEK]</div>
        <div class="controls-hint">STEROWANIE KLASYCZNE: NIE UDERZ W ŚCIANY ANI W SIEBIE</div>
    </div>

<script>
    const canvas = document.getElementById('snakeGame');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const startPrompt = document.getElementById('start-prompt');
    const overlay = document.getElementById('game-over');

    const gridSize = 25; 
    const tileCount = canvas.width / gridSize;

    let score = 0;
    let snake = [];
    let food = {x: 15, y: 15};
    let dx = 0, dy = 0;
    let nextDx = 0, nextDy = 0;
    let gameRunning = false;
    let gameStarted = false;
    let gameSpeed = 130;

    // --- SYSTEM AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, dur, vol = 0.05) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function initSnake() {
        snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];
    }

    function draw() {
        if (!gameRunning) return;

        dx = nextDx;
        dy = nextDy;
        
        if (gameStarted) {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Kolizja ze ścianami
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Kolizja z ciałem
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                playTone(440, 'square', 0.1);
                placeFood();
                if (gameSpeed > 60) gameSpeed -= 2;
            } else {
                snake.pop();
            }
        }

        // --- RENDEROWANIE ---
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Siatka neonowa
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
        ctx.lineWidth = 1;
        for(let i=0; i<=canvas.width; i+=gridSize) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Jedzenie (Neon Pink)
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#FF006E';
        ctx.fillStyle = '#FF006E';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/3, 0, Math.PI * 2);
        ctx.fill();

        // Wąż (Neon Blue)
        snake.forEach((part, index) => {
            const isHead = index === 0;
            ctx.shadowBlur = isHead ? 25 : 10;
            ctx.shadowColor = isHead ? '#00f2ff' : '#3A86FF';
            ctx.fillStyle = isHead ? '#00f2ff' : '#3A86FF';
            
            const x = part.x * gridSize + 2;
            const y = part.y * gridSize + 2;
            const w = gridSize - 4;
            const h = gridSize - 4;
            
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x, y, w, h, isHead ? 8 : 4);
            } else {
                ctx.rect(x, y, w, h);
            }
            ctx.fill();

            // Oczy na głowie
            if (isHead && (dx !== 0 || dy !== 0)) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                let eyeL = {x: 7, y: 7}, eyeR = {x: 15, y: 7};
                if (dy === 1) { eyeL.y = 15; eyeR.y = 15; }
                if (dx === -1) { eyeL = {x: 7, y: 7}; eyeR = {x: 7, y: 15}; }
                if (dx === 1) { eyeL = {x: 15, y: 7}; eyeR = {x: 15, y: 15}; }
                
                ctx.fillRect(part.x * gridSize + eyeL.x, part.y * gridSize + eyeL.y, 3, 3);
                ctx.fillRect(part.x * gridSize + eyeR.x, part.y * gridSize + eyeR.y, 3, 3);
            }
        });
        
        ctx.shadowBlur = 0;

        setTimeout(draw, gameSpeed);
    }

    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        if (snake.some(p => p.x === food.x && p.y === food.y)) placeFood();
    }

    function gameOver() {
        gameRunning = false;
        playTone(110, 'sawtooth', 0.5);
        overlay.style.display = 'flex';
        document.getElementById('final-score').innerText = "Wynik: " + score;
    }

    function resetGame() {
        score = 0;
        scoreElement.innerText = "0";
        nextDx = 0; nextDy = 0;
        dx = 0; dy = 0;
        gameSpeed = 130;
        gameRunning = true;
        gameStarted = false;
        overlay.style.display = 'none';
        startPrompt.style.display = 'block';
        initSnake();
        placeFood();
        draw();
    }

    window.addEventListener('keydown', e => {
        if (!gameStarted && [37, 38, 39, 40].includes(e.keyCode)) {
            gameStarted = true;
            startPrompt.style.display = 'none';
        }

        switch(e.keyCode) {
            case 38: if (dy !== 1) { nextDx = 0; nextDy = -1; } break;
            case 40: if (dy !== -1) { nextDx = 0; nextDy = 1; } break;
            case 37: if (dx !== 1) { nextDx = -1; nextDy = 0; } break;
            case 39: if (dx !== -1) { nextDx = 1; nextDy = 0; } break;
        }
        if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
    });

    initSnake();
    placeFood();
    gameRunning = true;
    draw();
</script>
</body>
</html>
