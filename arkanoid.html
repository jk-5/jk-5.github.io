<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; color: #fff; font-family: 'Orbitron', sans-serif; }
        #top-bar {
            position: absolute; top: 0; width: 100%; height: 55px;
            background: rgba(10, 10, 20, 0.9); border-bottom: 2px solid #00d2ff;
            display: flex; justify-content: space-around; align-items: center; z-index: 10;
        }
        canvas { display: block; }
        .game-active { cursor: none; }
        .ui-layer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: rgba(0,0,0,0.95); padding: 50px;
            border: 2px solid #00d2ff; border-radius: 20px; z-index: 20;
        }
        button {
            background: #00d2ff; border: none; color: #000; padding: 15px 45px;
            font-size: 1.5rem; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .stat span { color: #00d2ff; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="top-bar">
        <div class="stat">POZIOM: <span id="lvl-val">1</span></div>
        <div class="stat">WYNIK: <span id="score-val">0</span></div>
        <div class="stat">ŻYCIA: <span id="lives-val">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-screen" class="ui-layer">
        <h1 style="color:#00d2ff; font-size: 3rem; margin-bottom: 10px;">ARKANOID</h1>
        <button onclick="requestStart()">START</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const uiScreen = document.getElementById("ui-screen");

    // --- SYSTEM DŹWIĘKU ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(freq, type, dur, vol = 0.1) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    // --- STATE ---
    let balls = [], bricks = [], powerups = [];
    let paddle = { x: 0, w: 160, h: 20, baseW: 160 };
    let score = 0, lives = 3, level = 1, gameRunning = false;
    let buffs = { wide: 0, power: 0, shrink: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
        bricks = [];
        const rows = 3 + level;
        const cols = 10;
        const bW = (canvas.width - 110) / cols;
        for(let c=0; c<cols; c++) {
            bricks[c] = [];
            for(let r=0; r<rows; r++) {
                // 30% SZANSY NA BONUS
                let type = null;
                if(Math.random() < 0.30) {
                    const rand = Math.random();
                    if(rand < 0.3) type = 'multi';
                    else if(rand < 0.6) type = 'wide';
                    else if(rand < 0.8) type = 'power';
                    else type = 'shrink'; // Negatywny bonus
                }
                bricks[c][r] = {
                    x: c * (bW + 10) + 10, y: r * 35 + 80,
                    w: bW, h: 25, status: 1, type: type,
                    color: `hsl(${r * 30 + level * 40}, 70%, 50%)`
                };
            }
        }
    }

    function requestStart() {
        initAudio(); // Aktywacja dźwięku
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
        setTimeout(startGame, 200);
    }

    function startGame() {
        resize();
        initLevel();
        paddle.x = (canvas.width - paddle.w) / 2;
        balls = [{ x: canvas.width/2, y: canvas.height - 150, dx: 6, dy: -6, r: 10 }];
        powerups = [];
        buffs = { wide: 0, power: 0, shrink: 0 };
        uiScreen.style.display = "none";
        document.body.classList.add('game-active');
        gameRunning = true;
        updateUI();
        draw();
    }

    function updateUI() {
        document.getElementById("score-val").innerText = score;
        document.getElementById("lives-val").innerText = lives;
        document.getElementById("lvl-val").innerText = level;
    }

    document.addEventListener("mousemove", (e) => {
        paddle.x = e.clientX - paddle.w / 2;
        if(paddle.x < 0) paddle.x = 0;
        if(paddle.x > canvas.width - paddle.w) paddle.x = canvas.width - paddle.w;
    });

    function draw() {
        if(!gameRunning) return;

        ctx.fillStyle = "rgba(0, 0, 15, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- PALETKA ---
        let currentW = paddle.baseW;
        if(buffs.wide > 0) { currentW += 120; buffs.wide--; }
        if(buffs.shrink > 0) { currentW -= 80; buffs.shrink--; }
        paddle.w = Math.max(40, currentW);

        ctx.shadowBlur = 20;
        ctx.shadowColor = buffs.shrink > 0 ? "#ff0000" : "#00d2ff";
        ctx.fillStyle = buffs.shrink > 0 ? "#ff0000" : "#00d2ff";
        ctx.fillRect(paddle.x, canvas.height - 50, paddle.w, paddle.h);
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(paddle.x, canvas.height - 50, paddle.w, paddle.h);
        ctx.shadowBlur = 0;

        // --- KLOCKI ---
        let count = 0;
        bricks.forEach(col => col.forEach(b => {
            if(b.status) {
                count++;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }
        }));
        if(count === 0) { level++; startGame(); return; }

        // --- BONUSY ---
        powerups.forEach((p, i) => {
            p.y += 4;
            ctx.fillStyle = p.type === 'shrink' ? "#ff0000" : "#fff";
            ctx.font = "bold 20px Orbitron";
            ctx.fillText(`[${p.type[0].toUpperCase()}]`, p.x, p.y);

            if(p.y > canvas.height - 60 && p.x > paddle.x && p.x < paddle.x + paddle.w) {
                if(p.type === 'multi') {
                    const len = balls.length;
                    for(let j=0; j<len; j++) {
                        balls.push({...balls[j], dx: -balls[j].dx, dy: -Math.abs(balls[j].dy)});
                    }
                } else if(p.type === 'wide') buffs.wide += 500;
                else if(p.type === 'power') buffs.power += 400;
                else if(p.type === 'shrink') buffs.shrink += 500;
                
                playSound(800, 'square', 0.2);
                powerups.splice(i, 1);
            }
            if(p.y > canvas.height) powerups.splice(i, 1);
        });

        // --- KULE ---
        balls.forEach((ball, bi) => {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if(ball.x < 10 || ball.x > canvas.width - 10) { ball.dx *= -1; playSound(400, 'sine', 0.05); }
            if(ball.y < 65) { ball.dy *= -1; playSound(400, 'sine', 0.05); }

            // Kolizja paletka
            if(ball.y > canvas.height - 60 && ball.y < canvas.height - 20 && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                ball.dy = -Math.abs(ball.dy);
                ball.dx = (ball.x - (paddle.x + paddle.w/2)) / 8;
                playSound(300, 'sine', 0.1);
                ball.y = canvas.height - 65;
            }

            // Kolizja klocki
            bricks.forEach(col => col.forEach(b => {
                if(b.status && ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                    if(buffs.power <= 0) ball.dy *= -1;
                    b.status = 0;
                    score += 10; updateUI();
                    playSound(600, 'triangle', 0.05);
                    if(b.type) powerups.push({x: b.x + b.w/2, y: b.y, type: b.type});
                }
            }));

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fillStyle = buffs.power > 0 ? "#ff007f" : "#fff";
            ctx.fill();
            ctx.closePath();

            if(ball.y > canvas.height) balls.splice(bi, 1);
        });

        if(buffs.power > 0) buffs.power--;

        if(balls.length === 0) {
            lives--; updateUI();
            playSound(150, 'sawtooth', 0.4);
            if(lives <= 0) { gameRunning = false; uiScreen.style.display="block"; document.body.classList.remove('game-active'); }
            else balls = [{ x: canvas.width/2, y: canvas.height - 150, dx: 6, dy: -6, r: 10 }];
        }

        requestAnimationFrame(draw);
    }
</script>
</body>
</html>
