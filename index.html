<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K Serwis PC</title>
    
    <!-- Link do favicony -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        /* Styl dla Twojego logo */
        .logo {
            max-width: 180px; /* Nieco większe dla lepszej widoczności */
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 1.8rem;
        }
        p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 20px;
        }
        .status {
            display: inline-block;
            background: #fff3e0;
            color: #ef6c00;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .contact-info {
            font-weight: bold;
            color: #2c3e50;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Wyświetlanie Twojego logo -->
        <img src="logo.png" alt="J.K Serwis PC Logo" class="logo">
        
        <div class="status">Strona w budowie</div>
        <h1>J.K Serwis PC</h1>
        <p>Twój komputer potrzebuje pomocy? Jesteśmy w trakcie przygotowywania nowej odsłony naszej strony internetowej.</p>
        
        <div class="contact-info">
            Zapraszamy wkrótce!
        </div>
        
        <div class="footer">
            &copy; 2026 J.K Serwis PC | <a href="https://jk-5.github.io" style="color: #999; text-decoration: none;">jk-5.github.io</a>
        </div>
    </div>

</body>
</html>
