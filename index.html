<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K Serwis PC</title>
    
    <!-- Link do favicony -->
    <link rel="icon" type="image/x-icon" href="https://github.com/jk-5/jk-5.github.io/raw/refs/heads/main/favicon.ico">

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(15, 15, 20, 0.85), rgba(15, 15, 20, 0.85)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 40px 0;
        }

        .container {
            background: rgba(30, 30, 35, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin: 0 auto 35px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.7));
        }

        p {
            color: #b0b0b0;
            margin-bottom: 30px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .tiles-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            font-size: 1.1rem;
        }

        .tile:hover {
            background: #0078d4;
            border-color: #0086f0;
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(0, 120, 212, 0.5);
        }

        .footer {
            margin-top: 45px;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            line-height: 1.6;
        }

        .footer a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #0078d4;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Maksymalnie wyeksponowane logo -->
        <img src="logo.png" alt="J.K Serwis PC Logo" class="logo">
        
        <p>Wybierz kategorię:</p>

        <div class="tiles-list">
            <a href="programy.html" class="tile">Programy podstawowe</a>
            <a href="opcjonalne.html" class="tile">Programy opcjonalne</a>
            <a href="systemy.html" class="tile">Systemy operacyjne</a>
            <a href="instrukcje.html" class="tile">Instrukcje</a>
            <a href="ciekawe-strony.html" class="tile">Ciekawe strony</a>
        </div>
        
        <div class="footer">
            &copy; 2026 J.K Serwis PC | <a href="https://jk-5.github.io">jk-5.github.io</a><br>
            Projekt: <a href="https://github.com/jk-5/PS1Install" target="_blank">PowerShell Multi Installer</a>
        </div>
    </div>

</body>
</html>
