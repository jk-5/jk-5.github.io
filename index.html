<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K Serwis PC</title>
    
    <!-- Link do favicony -->
    <link rel="icon" type="image/x-icon" href="https://github.com/jk-5/jk-5.github.io/raw/refs/heads/main/favicon.ico">

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Ciemne tło z obrazkiem */
            background: linear-gradient(rgba(15, 15, 20, 0.85), rgba(15, 15, 20, 0.85)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 40px 0;
        }

        .container {
            background: rgba(30, 30, 35, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 450px; /* Zwężony kontener dla pionowego układu */
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        h1 {
            color: #ffffff;
            margin: 10px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        p {
            color: #b0b0b0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .status {
            display: inline-block;
            background: rgba(239, 108, 0, 0.15);
            color: #ffb74d;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 183, 77, 0.3);
        }

        /* Układ kafelków jeden pod drugim */
        .tiles-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            font-size: 1.05rem;
        }

        .tile:hover {
            background: #0078d4; /* Klasyczny kolor "PC" / Windows Blue */
            border-color: #0086f0;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 120, 212, 0.4);
        }

        .footer {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .footer a {
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="logo.png" alt="J.K Serwis PC Logo" class="logo">
        
        <div class="status">Tryb serwisowy</div>
        <h1>J.K Serwis PC</h1>
        <p>Wybierz zasoby do pobrania lub instrukcje:</p>

        <!-- Lista kafelków pionowo -->
        <div class="tiles-list">
            <a href="#" class="tile">Programy podstawowe</a>
            <a href="#" class="tile">Programy opcjonalne</a>
            <a href="#" class="tile">Systemy operacyjne</a>
            <a href="#" class="tile">Instrukcje</a>
            <a href="#" class="tile">Ciekawe strony</a>
        </div>
        
        <div class="footer">
            &copy; 2026 J.K Serwis PC | <a href="https://jk-5.github.io">jk-5.github.io</a>
        </div>
    </div>

</body>
</html>
