<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.K Serwis PC</title>
    
    <!-- Link do favicony -->
    <link rel="icon" type="image/x-icon" href="https://github.com/jk-5/jk-5.github.io/raw/refs/heads/main/favicon.ico">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Tło z obrazka */
            background: linear-gradient(rgba(244, 244, 249, 0.8), rgba(244, 244, 249, 0.8)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 800px; /* Zwiększyłem szerokość pod kafelki */
            width: 90%;
        }
        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 2rem;
        }
        .status {
            display: inline-block;
            background: #fff3e0;
            color: #ef6c00;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Styl kafelków */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .tile {
            background: #f8f9fa;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tile:hover {
            background: #2c3e50;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .footer {
            margin-top: 35px;
            font-size: 0.8rem;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="J.K Serwis PC Logo" class="logo">
        
        <div class="status">Strona w budowie</div>
        <h1>J.K Serwis PC</h1>
        <p>Wybierz interesującą Cię kategorię:</p>

        <!-- Sekcja kafelków -->
        <div class="tiles-grid">
            <a href="#" class="tile">Programy podstawowe</a>
            <a href="#" class="tile">Programy opcjonalne</a>
            <a href="#" class="tile">Systemy operacyjne</a>
            <a href="#" class="tile">Instrukcje</a>
            <a href="#" class="tile">Ciekawe strony</a>
        </div>
        
        <div class="footer">
            &copy; 2026 J.K Serwis PC | <a href="https://jk-5.github.io" style="color: #999; text-decoration: none;">jk-5.github.io</a>
        </div>
    </div>

</body>
</html>
