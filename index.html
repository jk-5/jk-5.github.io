<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Serwis | Strona w budowie</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #666;
        }
        .status {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
        .link {
            color: #0288d1;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status">Test Połączenia</div>
        <h1>JK Serwis</h1>
        <p>Twoja strona na GitHub Pages działa poprawnie!</p>
        <p>To jest tymczasowy plik index.html. Możesz go teraz dowolnie edytować lub podmienić na docelowy projekt.</p>
        
        <div class="footer">
            Strona hostowana za darmo na <a href="#" class="link">GitHub Pages</a>
        </div>
    </div>

</body>
</html>
